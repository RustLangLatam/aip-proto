// Reference API that passes api-linter with zero findings.
// Use it as a template for new resource-oriented gRPC APIs.
syntax = "proto3";

package acme.library.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Library.V1";
option go_package = "github.com/acme/library/apiv1/librarypb;librarypb";
option java_multiple_files = true;
option java_outer_classname = "LibraryProto";
option java_package = "com.acme.library.v1";
option php_namespace = "Acme\\Library\\V1";
option ruby_package = "Acme::Library::V1";

// Manages the books stored on shelves.
service LibraryService {
  option (google.api.default_host) = "library.acme.com";

  // Gets a book.
  rpc GetBook(GetBookRequest) returns (Book) {
    option (google.api.http) = {
      get: "/v1/{name=shelves/*/books/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists books on a shelf.
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=shelves/*}/books"
    };
    option (google.api.method_signature) = "parent";
  }

  // Creates a book.
  rpc CreateBook(CreateBookRequest) returns (Book) {
    option (google.api.http) = {
      post: "/v1/{parent=shelves/*}/books"
      body: "book"
    };
    option (google.api.method_signature) = "parent,book,book_id";
  }

  // Updates a book.
  rpc UpdateBook(UpdateBookRequest) returns (Book) {
    option (google.api.http) = {
      patch: "/v1/{book.name=shelves/*/books/*}"
      body: "book"
    };
    option (google.api.method_signature) = "book,update_mask";
  }

  // Deletes a book.
  rpc DeleteBook(DeleteBookRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=shelves/*/books/*}"
    };
    option (google.api.method_signature) = "name";
  }
}

// A book stored on a shelf.
message Book {
  option (google.api.resource) = {
    type: "library.acme.com/Book"
    pattern: "shelves/{shelf}/books/{book}"
    plural: "books"
    singular: "book"
  };

  // Identifier. The resource name of the book.
  // Format: `shelves/{shelf}/books/{book}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. The title of the book.
  string title = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. The author of the book.
  string author = 3 [(google.api.field_behavior) = OPTIONAL];

  // Output only. When the book was created.
  google.protobuf.Timestamp create_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When the book was last updated.
  google.protobuf.Timestamp update_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque checksum computed by the server, for optimistic concurrency control
  // (AIP-154). Update requests send it back inside `book`; a stale value fails
  // with ABORTED. Per AIP-154 and AIP-203 it has no field_behavior annotation.
  string etag = 6;
}

// Request message for GetBook.
message GetBookRequest {
  // Required. The name of the book to retrieve.
  // Format: `shelves/{shelf}/books/{book}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "library.acme.com/Book" }
  ];
}

// Request message for ListBooks.
message ListBooksRequest {
  // Required. The shelf that owns this collection of books.
  // Format: `shelves/{shelf}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { child_type: "library.acme.com/Book" }
  ];

  // Optional. The maximum number of books to return. The service may return
  // fewer. If unspecified, at most 50 books are returned; the maximum is 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token received from a previous `ListBooks` call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A filter expression following AIP-160.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Sort order following AIP-132, for example `title desc`.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListBooks.
message ListBooksResponse {
  // The books on the shelf.
  repeated Book books = 1;

  // A token to retrieve the next page. Empty when there are no more pages.
  string next_page_token = 2;
}

// Request message for CreateBook.
message CreateBookRequest {
  // Required. The shelf where the book is created.
  // Format: `shelves/{shelf}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { child_type: "library.acme.com/Book" }
  ];

  // Required. The book to create.
  Book book = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. The ID to use for the book, which becomes the final component
  // of its resource name. Must match `^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$`
  // (RFC-1034, AIP-122).
  string book_id = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Idempotency key (AIP-155), formatted as a UUID4.
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];

  // Optional. If set, validate the request without creating the book.
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for UpdateBook.
message UpdateBookRequest {
  // Required. The book to update. Its `name` identifies the target.
  Book book = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The fields to update. `*` replaces the whole resource.
  google.protobuf.FieldMask update_mask = 2
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. If set, validate the request without updating the book.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for DeleteBook.
message DeleteBookRequest {
  // Required. The name of the book to delete.
  // Format: `shelves/{shelf}/books/{book}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "library.acme.com/Book" }
  ];

  // Optional. The current etag. If it does not match, the request fails with
  // ABORTED (AIP-135, AIP-154).
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}
